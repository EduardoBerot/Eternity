<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X0KJ8S6DW1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-X0KJ8S6DW1');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070d16">
    <link rel="icon" href="imgs/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./imgs/pwa/eternity-icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <title>Eternity | Administração</title>
    <link rel="stylesheet" href="./css/painel.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="stylesheet" href="./css/responsive_panel.css">
    <!-- Tema do site (29/09/2026): tokens, navbar e botoes do site.css, e o
         painel-site.css por cima de tudo, escurecendo tabelas, cards e graficos. -->
    <link rel="stylesheet" href="./css/site.css">
    <link rel="stylesheet" href="./css/painel-site.css">
    <link rel="stylesheet" href="./css/analises.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="./css/cidade.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="site painel">
    <header class="topbar">
        <a class="brand" href="./index.html" title="Voltar ao site">Eternity</a>
        <span class="painel-selo">Painel</span>
        <nav id="main-menu" class="nav-links" aria-label="Seções do painel">
            <!-- Os ids sao lidos pelo render() do painel: nao renomear. -->
            <a tabindex="0" class="itens" id="solicitacoes" onclick="render(event)">Pendências</a>
            <a tabindex="0" class="itens" id="membros" onclick="render(event)">Membros</a>
            <a tabindex="0" class="itens" id="adicionar" onclick="render(event)">Adicionar</a>
            <a tabindex="0" class="itens" id="excluidos" onclick="render(event)">Banidos</a>
            <a tabindex="0" class="itens" id="historico" onclick="render(event)">Histórico</a>
            <a tabindex="0" class="itens" id="cidade" onclick="render(event)">Cidade</a>
            <a tabindex="0" class="itens itens--lider" id="recrutamento" onclick="render(event)" hidden>Recrutamento</a>
            <a tabindex="0" class="itens itens--lider" id="analises" onclick="render(event)" hidden>Análises</a>
            <div class="nav-actions">
                <div class="admin-profile" aria-label="Staff conectado">
                    <img id="admin_profile_head" alt="" width="28" height="28">
                    <span id="title_nick"></span>
                </div>
                <a class="social-link" href="./index.html" title="Voltar ao site" aria-label="Voltar ao site">
                    <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
                </a>
            </div>
        </nav>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="main-menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <main>
        <section id="app" class="content"></section>
    </main>
    <script>
        // Menu do celular: abre e fecha, e fecha ao escolher uma secao.
        (() => {
            const botao = document.getElementById('menu-toggle');
            const menu = document.getElementById('main-menu');
            const abrir = aberto => {
                menu.classList.toggle('open', aberto);
                botao.classList.toggle('open', aberto);
                botao.setAttribute('aria-expanded', String(aberto));
            };
            botao.addEventListener('click', () => abrir(!menu.classList.contains('open')));
            menu.addEventListener('click', event => { if (event.target.closest('.itens')) abrir(false); });
            window.addEventListener('scroll', () => {
                document.querySelector('.topbar').classList.toggle('rolou', window.scrollY > 8);
            }, { passive: true });
        })();
    </script>
    <script src="./js/global.js"></script>
    <script src="./js/painel/auth.js"></script>
    <script src="./js/painel/functions.js"></script>
    <script src="./js/painel/edit.js"></script>
    <script src="./js/home/aniver.js"></script>
    <script src="./js/painel/recrutamento.js"></script>
    <script src="./js/painel/analises.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="./js/cidade-marcas.js"></script>
    <script src="./js/painel/cidade.js"></script>
    <script src="./js/painel/index.js"></script>
</body>

</html>
